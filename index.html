<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Site</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:white;
    font-family:Arial, sans-serif;
    height:100vh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

/* Green image area */
.header{
    width:100%;
    height:80px;
    overflow:hidden;
    border-bottom:4px solid black;
}

.header img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* Center area */
.main{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding-top:10px;
}

/* Cyan box */
.content-box{
    width:min(800px, 90vw);
    height:calc(100vh - 110px);
    background:#1dc0f0;
    border:6px solid black;
    overflow-y:auto;
    padding:20px;
}

/* Top row */
.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
}

.lang-buttons{
    display:flex;
    gap:10px;
}

.lang-buttons button{
    background:#004cff;
    color:white;
    border:none;
    padding:8px 18px;
    border-radius:20px;
    cursor:pointer;
    font-weight:bold;
}

.lang-buttons button:hover{
    opacity:0.9;
}

.title{
    font-size:2rem;
    font-weight:bold;
    color:#ffcc00;
}

/* Text */
.content{
    font-size:1.1rem;
    line-height:1.8;
    white-space:pre-wrap;
}
</style>
</head>
<body>

<div class="header">
    <img src="header.png" alt="Header">
</div>

<div class="main">
    <div class="content-box">

        <div class="topbar">
            <div class="lang-buttons">
                <button onclick="setLanguage('en')">English</button>
                <button onclick="setLanguage('fr')">Français</button>
            </div>

            <div class="title" id="title"></div>
        </div>

        <div class="content" id="content"></div>

    </div>
</div>

<script>
const translations = {
    en: {
        title: "YOUR TITLE HERE",
        content: `
Paste your English text here.

This can be extremely long.

The cyan box will scroll internally while remaining centered.

Add as many paragraphs as you want.
`
    },

    fr: {
        title: "VOTRE TITRE ICI",
        content: `
Collez votre texte français ici.

Le texte peut être très long.

La boîte bleue restera centrée pendant le défilement.

Ajoutez autant de paragraphes que vous voulez.
`
    }
};

function setLanguage(lang){
    document.getElementById("title").textContent =
        translations[lang].title;

    document.getElementById("content").textContent =
        translations[lang].content;
}

setLanguage("en");
</script>

</body>
</html>
