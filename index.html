<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Eight 8</title>

<link rel="icon" href="./favicon.ico" sizes="any">
<link rel="shortcut icon" href="./favicon.ico" type="image/x-icon">
<link rel="apple-touch-icon" href="./favicon.ico">

<style>
body{
    margin:0;
    background:#eef2e3;
    font-family:Verdana,Arial,sans-serif;
    color:#000;
    overflow:hidden;
}

.header{
    width:100%;
    height:100px;
    border-bottom:2px solid #556b2f;
}

.header img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.main{
    display:flex;
    justify-content:center;
    padding:10px;
    height:calc(100vh - 120px);
}

/* board stays unchanged */
.board{
    width:min(900px,90vw);
    background:#e3ead7;
    border:1px solid #7f8f6a;
    padding:10px;
    display:flex;
    flex-direction:column;
    box-sizing:border-box;
}

/* ✅ NEW RIGHT PANEL */
.right-panel{
    width:220px;
    margin-left:10px;
    background:#e3ead7;
    border:1px solid #7f8f6a;
    padding:10px;
    box-sizing:border-box;
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-content:flex-start;
    overflow-y:auto;
}

/* ✅ NAME BOX STYLE */
.leader-box{
    width:100%;
    background:#f4f7ee;
    border:1px solid #a5b38a;
    padding:10px;
    text-align:center;
    font-size:13px;
    font-weight:bold;
    color:#2f5d1d;
}

/* existing styles unchanged */
.top{
    display:flex;
    justify-content:center;
    align-items:center;
    border-bottom:1px solid #a5b38a;
    padding-bottom:8px;
    margin-bottom:10px;
}

.title{
    font-size:24px;
    color:#556b2f;
    font-weight:bold;
    text-align:center;
}

.subtitle{
    text-align:center;
    color:#556b2f;
    font-size:11px;
    margin-bottom:10px;
}

.content{
    background:#f4f7ee;
    border:1px solid #a5b38a;
    padding:15px;
    overflow-y:auto;
    flex-grow:1;
    line-height:1.6;
    white-space:pre-wrap;
    font-size:13px;
    box-sizing:border-box;
}

a{
    color:#2f5d1d;
    text-decoration:underline;
}

a:visited{
    color:#4b5d35;
}
</style>
</head>

<body>

<div class="header">
    <img src="header.png" alt="Header">
</div>

<div class="main">

    <div class="board">

        <div class="top">
            <div class="title">Eight 8</div>
        </div>

        <div class="subtitle">
            National Socialism • Information • Documentation
        </div>

        <div class="content">
            <!-- YOUR CONTENT UNCHANGED -->
            (all your text remains exactly the same)
        </div>

    </div>

    <!-- ✅ NEW RIGHT SIDE AREA -->
    <div class="right-panel">
        <div class="leader-box">Adolf Hitler</div>
        <div class="leader-box">Joseph Goebbels</div>
        <div class="leader-box">Heinrich Himmler</div>
        <div class="leader-box">Hermann Göring</div>
    </div>

</div>

</body>
</html>
