<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Eight</title>

<!-- Favicon -->
<link rel="icon" href="favicon.ico" type="image/x-icon">
<link rel="shortcut icon" href="favicon.ico" type="image/x-icon">

<style>
body{
    margin:0;
    background:#eef2e3;
    font-family:Verdana,Arial,sans-serif;
    color:#000;
    overflow:hidden;
}

/* Header image */
.header{
    width:100%;
    height:100px;
    border-bottom:2px solid #556b2f;
}

.header img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* Main layout */
.main{
    display:flex;
    justify-content:center;
    padding:10px;
    height:calc(100vh - 120px);
}

/* Board */
.board{
    width:min(900px,90vw);
    background:#e3ead7;
    border:1px solid #7f8f6a;
    padding:10px;
    display:flex;
    flex-direction:column;
    box-sizing:border-box;
}

/* Top section */
.top{
    display:flex;
    justify-content:center;
    align-items:center;
    border-bottom:1px solid #a5b38a;
    padding-bottom:8px;
    margin-bottom:10px;
}

/* Title */
.title{
    font-size:24px;
    color:#556b2f;
    font-weight:bold;
    text-align:center;
}

/* Subtitle */
.subtitle{
    text-align:center;
    color:#556b2f;
    font-size:11px;
    margin-bottom:10px;
}

/* Content area */
.content{
    background:#f4f7ee;
    border:1px solid #a5b38a;
    padding:15px;
    overflow-y:auto;
    flex-grow:1;
    line-height:1.6;
    white-space:pre-wrap;
    font-size:13px;
    box-sizing:border-box;
}

/* Links */
a{
    color:#2f5d1d;
    text-decoration:underline;
}

a:visited{
    color:#4b5d35;
}
</style>
</head>

<body>

<div class="header">
    <img src="header.png" alt="Header">
</div>

<div class="main">
    <div class="board">

        <div class="top">
            <div class="title">YOUR TITLE HERE</div>
        </div>

        <div class="subtitle">
            Archive • Information • Documentation
        </div>

        <div class="content">
YOUR TEXT HERE.

This area can contain thousands of words.

The text scrolls while the forum box remains centered.

You can paste multiple pages worth of content.

Lorem ipsum dolor sit amet...
        </div>

    </div>
</div>

</body>
</html>
