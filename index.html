<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Website</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: white;
    font-family: Arial, sans-serif;
}

/* GREEN HEADER IMAGE */
.header {
    width: 100%;
    height: 120px;
    overflow: hidden;
}

.header img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* CENTERED CYAN BOX */
.content-container {
    display: flex;
    justify-content: center;
    padding: 10px 0;
}

.content-box {
    width: min(800px, 90vw);
    height: calc(100vh - 150px);
    background: #26c6da;
    border: 5px solid black;

    display: flex;
    flex-direction: column;
}

/* TOP BAR */
.top-bar {
    padding: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

/* LANGUAGE BUTTONS */
.language-buttons {
    display: flex;
    gap: 8px;
}

.language-buttons button {
    padding: 6px 12px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    background: #005eff;
    color: white;
    font-weight: bold;
}

/* TITLE */
#title {
    color: gold;
    font-size: 2rem;
    text-align: center;
    flex-grow: 1;
}

/* SCROLLABLE TEXT */
.scroll-area {
    flex: 1;
    overflow-y: auto;
    padding: 25px;
    font-size: 1.1rem;
    line-height: 1.8;
}
</style>
</head>

<body>

<div class="header">
    <img src="header.png" alt="Banner">
</div>

<div class="content-container">
    <div class="content-box">

        <div class="top-bar">
            <div class="language-buttons">
                <button onclick="setLanguage('en')">EN</button>
                <button onclick="setLanguage('fr')">FR</button>
            </div>

            <h1 id="title"></h1>

            <div style="width:80px;"></div>
        </div>

        <div class="scroll-area">
            <p id="content"></p>
        </div>

    </div>
</div>

<script>
const translations = {
    en: {
        title: "YOUR ENGLISH TITLE",

        content: `
PASTE YOUR LONG ENGLISH TEXT HERE.

You can make this as long as you want.

The content area will automatically become scrollable when the text exceeds the visible space.

Add multiple paragraphs if desired.
`
    },

    fr: {
        title: "VOTRE TITRE FRANÇAIS",

        content: `
COLLEZ VOTRE LONG TEXTE FRANÇAIS ICI.

La zone de contenu défilera automatiquement lorsque le texte est plus long que l'espace disponible.

Vous pouvez écrire plusieurs paragraphes.
`
    }
};

function setLanguage(lang) {
    document.getElementById("title").textContent =
        translations[lang].title;

    document.getElementById("content").textContent =
        translations[lang].content;
}

setLanguage('en');
</script>

</body>
</html>
