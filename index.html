<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Jew Blog</title>

<style>
body{
    margin:0;
    background:#ffffee;
    font-family:Verdana,Arial,sans-serif;
    color:#000;
    overflow:hidden;
}

/* Header image */
.header{
    width:100%;
    height:100px;
    border-bottom:1px solid #800000;
}

.header img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* Main layout */
.main{
    display:flex;
    justify-content:center;
    padding:10px;
    height:calc(100vh - 120px);
}

/* Board */
.board{
    width:min(900px,90vw);
    background:#f0e0d6;
    border:1px solid #b7c5d9;
    padding:10px;
    display:flex;
    flex-direction:column;
}

/* Top section */
.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #b7c5d9;
    padding-bottom:8px;
    margin-bottom:10px;
}

.title{
    font-size:24px;
    color:#800000;
    font-weight:bold;
    text-align:center;
    flex-grow:1;
}

.buttons{
    display:flex;
    gap:5px;
}

button{
    background:#d6daf0;
    border:1px solid #b7c5d9;
    font-size:11px;
    font-family:Verdana,sans-serif;
    cursor:pointer;
    padding:4px 10px;
}

button:hover{
    background:#c8d0ea;
}

/* Subtitle */
.subtitle{
    text-align:center;
    color:#707070;
    font-size:11px;
    margin-bottom:10px;
}

/* Scrollable content */
.content{
    background:#f7f1e7;
    border:1px solid #d9bfb7;
    padding:15px;
    overflow-y:auto;
    flex-grow:1;
    line-height:1.6;
    white-space:pre-wrap;
    font-size:13px;
}

/* Old-school links */
a{
    color:#0000EE;
    text-decoration:underline;
}

a:visited{
    color:#551A8B;
}
</style>
</head>

<body>

<div class="header">
    <img src="header.png" alt="Header">
</div>

<div class="main">
    <div class="board">

        <div class="top">
            <div class="buttons">
                <button onclick="setLang('en')">English</button>
                <button onclick="setLang('fr')">Français</button>
            </div>

            <div class="title" id="title"></div>
        </div>

        <div class="subtitle">
            Archive • Information • Documentation
        </div>

        <div class="content" id="content"></div>

    </div>
</div>

<script>

const translations = {

    en: {
        title: "YOUR ENGLISH TITLE",

        content: `
PUT YOUR ENGLISH TEXT HERE.

This area can contain thousands of words.

The text scrolls while the forum box remains centered.

You can paste multiple pages worth of content.

Lorem ipsum dolor sit amet...
`
    },

    fr: {
        title: "VOTRE TITRE FRANÇAIS",

        content: `
METTEZ VOTRE TEXTE FRANÇAIS ICI.

Cette zone peut contenir des milliers de mots.

Le texte défile tandis que la boîte reste centrée.

Vous pouvez coller plusieurs pages de contenu.

Lorem ipsum dolor sit amet...
`
    }

};

function setLang(lang){
    document.getElementById("title").textContent =
        translations[lang].title;

    document.getElementById("content").textContent =
        translations[lang].content;
}

setLang("en");

</script>

</body>
</html>
