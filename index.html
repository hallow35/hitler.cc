<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EightEight</title>

<!-- Website tab icon -->
<link rel="icon" type="image/png" href="favicon.png">

<style>
body{
    margin:0;
    background:#ffffee;
    font-family:Verdana,Arial,sans-serif;
    color:#000;
    overflow:hidden;
}

/* Header image */
.header{
    width:100%;
    height:100px;
    border-bottom:1px solid #556b2f; /* Moss green */
}

.header img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* Main layout */
.main{
    display:flex;
    justify-content:center;
    padding:10px;
    height:calc(100vh - 120px);
}

/* Board */
.board{
    width:min(900px,90vw);
    background:#f0e0d6;
    border:1px solid #b7c5d9;
    padding:10px;
    display:flex;
    flex-direction:column;
}

/* Top section */
.top{
    display:flex;
    justify-content:center;
    align-items:center;
    border-bottom:1px solid #b7c5d9;
    padding-bottom:8px;
    margin-bottom:10px;
}

/* Title */
.title{
    font-size:24px;
    color:#556b2f; /* Moss green */
    font-weight:bold;
    text-align:center;
}

/* Subtitle */
.subtitle{
    text-align:center;
    color:#707070;
    font-size:11px;
    margin-bottom:10px;
}

/* Scrollable content */
.content{
    background:#f7f1e7;
    border:1px solid #d9bfb7;
    padding:15px;
    overflow-y:auto;
    flex-grow:1;
    line-height:1.6;
    white-space:pre-wrap;
    font-size:13px;
}

/* Old-school links */
a{
    color:#0000EE;
    text-decoration:underline;
}

a:visited{
    color:#551A8B;
}
</style>
</head>

<body>

<div class="header">
    <img src="header.png" alt="Header">
</div>

<div class="main">
    <div class="board">

        <div class="top">
            <div class="title">YOUR TITLE HERE</div>
        </div>

        <div class="subtitle">
            Archive • Information • Documentation
        </div>

        <div class="content">
YOUR TEXT HERE.

This area can contain thousands of words.

The text scrolls while the forum box remains centered.

You can paste multiple pages worth of content.

Lorem ipsum dolor sit amet...
        </div>

    </div>
</div>

</body>
</html>
